# Tenant overrides for the "liberia" state tenant on the CRS central instance.
# Applied on top of each chart's values.yaml by the liberia ArgoCD ApplicationSets
# (config-as-code/helm/charts/argo-cd/liberia/). Shared egov-namespace services are
# configured in crs-central-instance.yaml.
global:
  domain: liberia-hcm.digit.org
  hosts:
    - liberia-hcm.digit.org

namespace: liberia

service:
  additionalAnnotations: |
    zuul/route-host: liberia-hcm.digit.org

disableAnnotationTimestamp: true

workbench-ui:
  image:
    repository: egovio/workbench-ui
    tag: nigeria_mc-211cbac
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://central-instance-uat-assets.s3.af-south-1.amazonaws.com/liberia/globalConfigsWorkbench.js type=text/javascript></script>';"
  namespace: liberia

