# Tenant overrides for the "liberia" state tenant on the CRS central instance.
# Applied on top of each chart's values.yaml by the liberia ArgoCD ApplicationSets
# (config-as-code/helm/charts/argo-cd/liberia/). Shared egov-namespace services are
# configured in crs-central-instance.yaml.
global:
  domain: liberia-hcm.digit.org
  hosts:
    - liberia-hcm.digit.org

namespace: liberia

disableAnnotationTimestamp: true

workbench-ui:
  image:
    repository: egovio/workbench-ui
    tag: master-84d425a
  namespace: liberia
  # TODO(liberia): globalConfigs*.js still point at the demo assets (stateTenantId=demo).
  # Publish Liberia globalConfigs (stateTenantId: liberia) and update these URLs before go-live.
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/demo/globalConfigsWorkbenchDemo.js type=text/javascript ></script>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/analytics/consoleAnalyticsDemo.js type=text/javascript ></script>
      ';"  

