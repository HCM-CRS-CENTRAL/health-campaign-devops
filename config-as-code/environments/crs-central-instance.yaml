global:
   domain: crs-central-instance.digit.org ## Add your Domain Name "Eg: site.mydomain.com" Do not use the dummy domain
   setup: fullsetup
   ## Hosts the gateway (zuul) ingresses answer on: the central domain plus one host per tenant.
   ## Non-gateway ingresses (root redirect, pgadmin, url-shortening) use `domain` above.
   hosts:
     - crs-central-instance.digit.org
     - liberia-hcm.digit.org
   schema:
     - liberia

cluster-configs:
    namespaces:  
      create: true
      values: [ backbone, cert-manager, egov, es-cluster, kafka-kraft, logging, monitoring, playground, liberia ]
      
    root-ingress:
      cert-issuer: letsencrypt-prod
      namespace: egov
      appRoot: console
      serviceName: console

    ## Let's Encrypt (HTTP-01) certificates for every host in global.hosts. Secrets are named
    ## <host>-tls-certs, which is what the chart ingresses reference. A Certificate is needed in
    ## each namespace that has ingresses for the host (TLS secrets are namespace-local).
    ## Argo CD repo-server Azure creds (SOPS decrypt). clientId/tenantId/clientSecret live in
    ## crs-central-instance-secrets.yaml; see templates/secrets/argocd-azure-creds-secret.yaml.
    secrets:
      argocd-azure-creds:
        name: argocd-rs-crs-central-instance-azure-creds
        namespace: argocd

    certificates:
      enabled: true
      issuer: letsencrypt-prod
      hosts:
        - host: crs-central-instance.digit.org
          namespaces: [ egov ]
        - host: liberia-hcm.digit.org
          namespaces: [ egov, liberia ]

    configmaps:
        egov-config:
            namespace: [ egov, monitoring, es-cluster, liberia ]
            data:
                db-host: crs-central-instance-server.postgres.database.azure.com ## Add db-host name eg: egov-demo.database.azure.com
                db-name: crscentralinstance ## Add db-name
                db-url: "jdbc:postgresql://crs-central-instance-server.postgres.database.azure.com:5432/crscentralinstance" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo
                db-url-no-schema: "jdbc:postgresql://crs-central-instance-server.postgres.database.azure.com:5432/crscentralinstance" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo
                liberia-db-url: "jdbc:postgresql://crs-central-instance-server.postgres.database.azure.com:5432/crscentralinstance?currentSchema=liberia" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo?currentSchema=demo
                domain: liberia-hcm.digit.org ## Add your Domain Name
                redis-host: "redis.backbone.svc.cluster.local"
                redis-downsync-host: "redis.backbone.svc.cluster.local"
                egov-services-fqdn-name: https://liberia-hcm.digit.org/ ## Add your Domain Name
                kibana-host: http://release-name-kibana.es-cluster:5601/
                kibana-base-path: kibana
                state-level-tenantid-length: "1"
                state-schema-index-position-tenantid: "0"
                is-environment-central-instance: "true"
                egov-state-level-tenant-id: "liberia"
                state-level-tenant-id: "liberia"
                kafka-tenant-id-pattern: "(liberia)-"
                gateway-discovery-namespace: "egov,liberia"
                s3-assets-bucket: "(pg-health-egov-assets|egov-health-playground-assets)"
                es-host: "elasticsearch-data.es-cluster"
                es-host-6: "elasticsearch-data.es-cluster"
                es-indexer-host: "https://elasticsearch-master.es-cluster:9200/"
                es-indexer-host-8: "https://elasticsearch-master.es-cluster:9200/"
                flyway-locations: "filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa"
                kafka-brokers: "release-name-kafka-controller-headless.kafka-kraft:9092"
                kafka-infra-brokers: "kafka-v2-infra.kafka-cluster:9092"
                logging-level-jdbc: "DEBUG"
                mobile-validation-workaround: "true"
                serializers-timezone-in-ist: "true"
                server-tomcat-max-connections: "500"
                server-tomcat-max-threads: "10"
                sms-enabled: "true"
                spring-datasource-tomcat-initialSize: "1"
                spring-datasource-tomcat-max-active: "2"
                spring-jpa-show-sql: "true"
                timezone: "UTC"
                tracer-errors-provideexceptionindetails: "true"
                egov-internal-microservice-user-uuid: fa0f820c-49df-46bb-8e62-8a0ec5d9af5e
                db-schema-names: "liberia"
                boundary-hierarchy: 'MICROPLAN'
                boundary-hierarchy-admin: 'ADMIN'
                

