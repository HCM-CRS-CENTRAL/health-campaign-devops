egov-malware-detection:
  image:
    repository: egovio/egov-malware-detection
    tag: master-malware-fix-77a437a
  initContainers:
    dbMigration:
      image:
        repository: egovio/egov-malware-detection-db
        tag: master-malware-fix-77a437a  
