### Prometheus & Alertmanager >>>>>>>>>>>>>>>>>>>>
prometheus:
  retention: 90d
  storageSpec:
    volumeClaimTemplate:
      spec:
        storageClassName: default
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
  alertmanager:
    enabled: true
  externalLabels:
    cluster: crs-central-instance
  additionalScrapeConfigs:
    - job_name: 'ingress-nginx-metrics'
      static_configs:
        - targets: [ 'ingress-nginx-controller-metrics.egov:10254' ]
    - job_name: 'blackbox'
      metrics_path: /probe
      params:
        module: [ http_2xx ]
      static_configs:
        - targets:
            - https://crs-central-instance.digit.org/jupyter/hub/
            - https://crs-central-instance.digit.org/kibana/
            - https://crs-central-instance.digit.org/pgadmin/
      relabel_configs:
        - source_labels: [ __address__ ]
          target_label: __param_target
        - source_labels: [ __param_target ]
          target_label: instance
        - target_label: __address__
          replacement: prometheus-blackbox-exporter:9115
    - job_name: 'blackbox_exporter'
      static_configs:
        - targets: [ 'prometheus-blackbox-exporter:9115' ]
# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

### loki-stack >>>>>>>>>>>>>>>>>>>>
loki:
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 30Gi
  serviceAccount:
    annotations: { }
  additionalConfigs:
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/index_cache
        shared_store: filesystem
        cache_ttl: 24h
      filesystem:
        directory: /data/loki/chunks
    compactor:
      working_directory: /data/loki/boltdb-shipper-compactor
      shared_store: filesystem
      retention_enabled: true
      compaction_interval: 168h
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h  # 7 days

internal-gateway-scg:
  image:
    repository: egovio/internal-gateway-scg
    tag: 2.9-LTS-internal-gateway-c1856da
  kafka-consumer-group-id: internal-gateway
  internal-gateway-json-path: file:///work-dir/health-campaign-config/internal-gateway/internal-gateway.json
  initContainers:
    gitSync:
      repo: git@github.com:HCM-CRS-CENTRAL/health-campaign-config
      branch: crs-central-instance
