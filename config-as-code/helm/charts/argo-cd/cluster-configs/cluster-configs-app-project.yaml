## AppProject for the cluster-configs Application on the CRS central instance (Azure AKS).
## Modelled on DIGIT-DevOps unified-dev cluster-configs-app-project.yaml.
##
## cluster-configs creates cluster-scoped objects (Namespace, ClusterRole,
## ClusterRoleBinding) as well as namespaced ones, and writes ConfigMaps/Secrets
## into every tenant namespace, so destinations are left open.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-configs-project
  namespace: argocd
spec:
  description: Cluster-level configuration for the CRS central instance
  sourceRepos:
    - git@github.com:HCM-CRS-CENTRAL/health-campaign-devops.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: Endpoints
    - group: networking.k8s.io
      kind: Ingress
    - group: cert-manager.io
      kind: Certificate
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
