{{- /*
Azure service-principal credentials argocd-repo-server uses to decrypt SOPS files
(helm-secrets, secrets://). Referenced by AZURE_CLIENT_ID / AZURE_TENANT_ID /
AZURE_CLIENT_SECRET in backbone-services/argo-cd/values.yaml.

Chicken-and-egg: the repo-server needs this Secret before it can decrypt the file that
holds it, so it is created once by hand
(helm/charts/argo-cd/bootstrap/create-argocd-sops-creds.sh); after that cluster-configs
adopts it and keeps it in sync with git.

  cluster-configs.secrets.argocd-azure-creds:
    name / namespace              -> environments/<env>.yaml
    clientId / tenantId / clientSecret -> environments/<env>-secrets.yaml (SOPS)

The repo-server reads these as env vars at start-up: after rotating the secret,
restart it (kubectl -n argocd rollout restart deploy argocd-repo-server).
*/ -}}
{{- with index .Values "cluster-configs" "secrets" "argocd-azure-creds" }}
{{- if .clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name | default "argocd-repo-server-azure-creds" }}
  namespace: {{ .namespace | default "argocd" }}
type: Opaque
data:
  client-id: {{ .clientId | b64enc | quote }}
  tenant-id: {{ .tenantId | b64enc | quote }}
  client-secret: {{ .clientSecret | b64enc | quote }}
{{- end }}
{{- end }}
